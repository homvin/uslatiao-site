<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your Cart — HICHEN Asian Market</title>
  <link rel="canonical" href="https://www.uslatiao.com/cart.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="HICHEN Asian Market">
  <meta property="og:image" content="https://www.uslatiao.com/assets/img/og-cover.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="HICHEN Asian Market - The Spicy Food Lover's Paradise.">
  <meta name="twitter:image" content="https://www.uslatiao.com/assets/img/og-cover.jpg">
  <meta property="og:title" content="Your Cart — HICHEN Asian Market">
  <meta property="og:description" content="Review your HICHEN Asian Market cart. Stocked in the US, ships in 1 business day.">
  <meta property="og:url" content="https://www.uslatiao.com/cart.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Your Cart — HICHEN Asian Market">
  <meta name="twitter:description" content="Review your HICHEN Asian Market cart. Stocked in the US, ships in 1 business day.">
  <meta name="description" content="Review your HICHEN Asian Market cart. Stocked in the US, ships in 1 business day.">
  <link rel="stylesheet" href="assets/css/styles.css?v=42">
  <script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
</head>
<body>
  <div id="site-header"></div>

  <div class="container page-head">
    <h1>Your cart</h1>
    <p class="muted">Stocked in the US. Ships in 1 business day.</p>
  </div>

  <section class="section container" style="padding-top:10px">
    <div style="display:grid;grid-template-columns:1fr 320px;gap:30px;align-items:start" id="cart-layout">
      <div id="cart-items"></div>
      <div class="summary" id="cart-summary"></div>
    </div>
  </section>

  <div id="site-footer"></div>

  <script src="assets/js/config.js?v=15"></script>
  <script src="assets/js/cloud.js?v=9"></script>
  <script src="assets/js/store.js?v=8"></script>
  <script src="assets/js/data.js?v=33"></script>
  <script src="assets/js/signup.js?v=3"></script><script src="assets/js/layout.js?v=14"></script>
  <script src="assets/js/app.js?v=7"></script>
<script src="assets/js/analytics.js?v=1"></script>
  <script src="assets/js/shop.js?v=21"></script>
  <script>
    (async function () {
      const C = window.APP_CONFIG;
      const items = document.getElementById('cart-items');
      const summary = document.getElementById('cart-summary');
      const products = window.Shop.sellable(await window.Data.getProductsFront());
      const bySlug = Object.fromEntries(products.map(p => [p.slug, p]));
      let cart = window.Store.get();

      function render() {
        if (!cart.length) {
          items.innerHTML = `<div class="note">Your cart is empty. <a href="shop.html">Go snack hunting →</a></div>`;
          summary.innerHTML = '';
          return;
        }
        items.innerHTML = cart.map(it => {
          const p = bySlug[it.slug];
          if (!p) return '';
          const price = (it.variant && it.variant.price != null) ? it.variant.price : p.price;
          const varLine = it.variant && (it.variant.option_label || it.variant.sku) ? `<div class="muted" style="font-size:12px">${p.option_name ? p.option_name + ': ' : ''}${it.variant.option_label || it.variant.sku}</div>` : '';
          const k = it.key || it.slug;
          return `<div class="line">
            <div class="thumb" style="aspect-ratio:1/1;background:#faf7f2;border:1px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px">${window.Shop.emojiFor(p)}</div>
            <div><div class="t"><a href="product.html?slug=${p.slug}">${p.name}</a></div>${varLine}<div class="muted" style="font-size:13px">${window.Money(price)} each</div></div>
            <div class="qty">
              <button data-act="dec" data-key="${k}">−</button>
              <span>${it.qty}</span>
              <button data-act="inc" data-key="${k}">+</button>
            </div>
            <div style="text-align:right"><div class="t">${window.Money(price * it.qty)}</div><button class="btn ghost small" data-act="rm" data-key="${k}" style="margin-top:6px">Remove</button></div>
          </div>`;
        }).join('');

        items.querySelectorAll('button[data-act]').forEach(b => {
          b.onclick = () => {
            const k = b.dataset.key, act = b.dataset.act;
            const cur = window.Store.get().find(x => (x.key || x.slug) === k);
            if (act === 'inc') window.Store.setQty(k, (cur ? cur.qty : 0) + 1);
            else if (act === 'dec') window.Store.setQty(k, (cur ? cur.qty : 0) - 1);
            else window.Store.remove(k);
            cart = window.Store.get();
            render();
          };
        });

        const subtotal = cart.reduce((s, it) => {
          const p = bySlug[it.slug]; if (!p) return s;
          const price = (it.variant && it.variant.price != null) ? it.variant.price : p.price;
          return s + price * it.qty;
        }, 0);
        const shipping = subtotal >= C.FREE_SHIP_THRESHOLD ? 0 : (subtotal > 0 ? 4.99 : 0);
        const total = subtotal + shipping;
        const remain = Math.max(0, C.FREE_SHIP_THRESHOLD - subtotal);
        const shipNote = subtotal === 0 ? '' :
          (shipping === 0 ? `<div class="row" style="color:var(--green);font-weight:700">🚚 Free shipping unlocked</div>`
                              : `<div class="row muted" style="font-size:13px">Add ${window.Money(remain)} for free shipping</div>`);
        summary.innerHTML = `
          <h3 style="margin:0 0 14px">Order summary</h3>
          <div class="row"><span>Subtotal</span><span>${window.Money(subtotal)}</span></div>
          <div class="row"><span>Shipping</span><span>${shipping === 0 ? 'Free' : window.Money(shipping)}</span></div>
          ${shipNote}
          <div class="row total"><span>Total</span><span>${window.Money(total)}</span></div>
          <a class="btn red" href="checkout.html" style="width:100%;margin-top:16px">Checkout</a>
          <a class="btn ghost" href="shop.html" style="width:100%;margin-top:10px">Keep shopping</a>`;
      }
      render();
    })();
  </script>
</body>
</html>
