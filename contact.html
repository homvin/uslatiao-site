<body>
  <div id="site-header"></div>
  <div class="container page-head"><h1>Contact us</h1></div>
  <section class="section container" style="padding-top:10px">
    <div class="form">
      <p class="muted">Questions about an order, an ingredient, or a flavor we should stock? Send a note.</p>
      <div class="field"><label>Email</label><input id="c-email" type="email" placeholder="you@example.com"></div>
      <div class="field"><label>Message</label><textarea id="c-msg" rows="5" placeholder="How can we help?"></textarea></div>
      <button class="btn red" id="c-send">Send</button>
      <div class="note blue" style="display:none" id="c-note"></div>
      <p class="muted" style="margin-top:18px">Or email us directly at <strong>support@uslatiao.com</strong> (placeholder — set your real address in config.js).</p>
    </div>
  </section>
  <div id="site-footer"></div>
  <script src="assets/js/config.js?v=15"></script><script src="assets/js/cloud.js?v=9"></script><script src="assets/js/store.js?v=8"></script>
  <script src="assets/js/data.js?v=32"></script><script src="assets/js/signup.js?v=3"></script><script src="assets/js/layout.js?v=14"></script><script src="assets/js/app.js?v=7"></script>
<script src="assets/js/analytics.js?v=1"></script>
  <script>
    document.getElementById('c-send').onclick = () => {
      const email = document.getElementById('c-email').value.trim();
      const msg = document.getElementById('c-msg').value.trim();
      if (!email || !msg) { window.Layout.toast('Fill in email and message'); return; }
      const n = document.getElementById('c-note');
      n.style.display = 'block';
      n.textContent = 'Thanks — this is a preview, so nothing was sent. Wire up email in the next step.';
    };
  </script>
</body>
</html>
